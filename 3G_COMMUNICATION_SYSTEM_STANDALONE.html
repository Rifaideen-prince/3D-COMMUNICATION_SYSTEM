  <style>
    :root {
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Outfit', sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background-color: #030712;
      color: #f3f4f6;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    .telecom-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }
    .surveillance-scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 4px 100%;
      pointer-events: none;
    }
    .glow-cyan {
      box-shadow: 0 0 20px -3px rgba(6, 182, 212, 0.35);
    }
    .glow-red {
      box-shadow: 0 0 25px 2px rgba(239, 68, 68, 0.5);
      animation: pulse-red 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; box-shadow: 0 0 25px 2px rgba(239, 68, 68, 0.6); }
      50% { opacity: 0.85; box-shadow: 0 0 10px 0px rgba(239, 68, 68, 0.2); }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

        network: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>,
        sliders: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x1="21" y1="4" y2="14"/><line x1="4" x1="21" y1="18" y2="20"/><line x1="12" x1="21" y1="2" y2="8"/><line x1="12" x1="21" y1="12" y2="22"/><line x1="20" x1="21" y1="4" y2="10"/><line x1="20" x1="21" y1="14" y2="20"/><line x1="1" x1="7" y1="14" y2="14"/><line x1="9" x1="15" y1="8" y2="8"/><line x1="17" x1="23" y1="10" y2="10"/></svg>,

        shield: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,

        send: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>,
        close: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      };
      return icons[name] || <span />;
    };

    // System Static Data
    const SYSTEM_NODES = [
      {
        id: 'camera-unit',
        name: 'Mobile Camera Unit',
        shortName: 'Mobile Camera',
        subtitle: 'Edge Capture & 3G UE',
        category: 'User Equipment',
        purpose: 'Captures raw high-definition video and ambient audio, compresses the media into optimized digital streams, and transmits via 3G modem.',
        functions: [
          'Visual & audio sensor acquisition (Camera sensor & directional mic)',
          'Hardware video encoding (H.264 Baseline Profile / MPEG-4 Part 2)',
          'Packetization into RTP/UDP/IP payloads',
          '3G/WCDMA User Equipment (UE) modem transmission',
          'Power management via internal high-capacity battery'
        ],
        dataHandled: 'Raw video frames, compressed video bitstream (256 kbps baseline), audio packets, telemetry.',
        roleInRealTime: 'Originates delay-sensitive video, audio, and emergency alarm packets. Adjusts encoder rate dynamically.',
        subComponents: ['Optical Lens & CMOS Sensor', 'Omni Microphone', 'Hardware Video Encoder', '3G WCDMA Modem (UE)', 'Li-ion Battery Pack']
      },
      {
        id: 'node-b',
        name: 'Node B (Base Station)',
        shortName: 'Node B',

          'Inner-loop fast power control (1,500 Hz slot rate)',
          'Air interface modulation, demodulation, and channel coding'
        ],
        dataHandled: 'Air interface radio frames, WCDMA chip-level symbols (3.84 Mcps), dedicated physical channels (DPCH/PRACH).',
        roleInRealTime: 'Ensures reliable low-latency wireless transmission over the wireless link and monitors instantaneous channel fading.',
        subComponents: ['Radio Transceiver (TRX)', 'Power Amplifiers', 'Duplexer & Antennas', 'Baseband DSP Unit']
      },
      {
        id: 'rnc',
        name: 'Radio Network Controller (RNC)',
        shortName: 'RNC',
        subtitle: 'Radio Resource Management',
        category: 'Radio Access Network',
        purpose: 'Governs all radio resources across multiple Node Bs, coordinates seamless handovers, and manages admission control.',
        functions: [

        ],
        dataHandled: 'RLC protocol data units (PDUs), radio signaling messages (NBAP, RRC, RANAP), user payload frames.',

      },

        name: 'Private IP Network / Internet',
        shortName: 'Private IP Network',

        category: 'Transport',
        purpose: 'Transports routed IP packets securely across private leased lines or encrypted VPN tunnels to the application server.',
        functions: [
          'IP packet routing and high-speed multi-gigabit switching',

          'DiffServ / MPLS Traffic Engineering (QoS preservation)'
        ],

      },
      {

        name: 'Application / Streaming Server',
        shortName: 'Streaming Server',

      {

        ],
        dataHandled: 'Decoded video frames, audio samples, operator control commands, real-time diagnostic telemetry.',

    ];

    const SCENARIO_STEPS = [
      { step: 1, title: 'Camera Boot & 3G UE Registration', state: 'CONNECTED', desc: 'The mobile camera powers on. Its 3G modem registers with Node B, completes 3GPP AKA authentication with Packet Core, and establishes a PDP context with IP 10.240.18.42.' },
      { step: 2, title: 'Video Stream Start & QoS Allocation', state: 'STREAMING', desc: 'Camera initiates RTSP session. RNC allocates a guaranteed 256 kbps Streaming Radio Access Bearer (RAB) to protect video frames.' },
      { step: 3, title: 'Normal Mobile Patrol & Link Maintenance', state: 'MOVING', desc: 'Patrol vehicle moves through Cell A. Fast inner-loop power control at 1,500 Hz maintains optimal SIR at -8.2 dB Ec/No.' },
      { step: 4, title: 'Cell Boundary Reached & Seamless Handover', state: 'HANDOVER', desc: 'Vehicle approaches cell edge. RNC initiates make-before-break WCDMA soft handover, transferring connection to Cell B with 0 dropped video frames.' },
      { step: 5, title: 'Network Congestion & QoS Traffic Protection', state: 'CONGESTED', desc: 'Heavy background traffic occurs. Strict priority queueing throttles low-priority logs while real-time video/audio stream cleanly.' },
      { step: 6, title: 'Emergency Alarm Trigger & Immediate Dispatch', state: 'EMERGENCY', desc: 'Tactical emergency tripped. High-priority ALARM packet preempts normal traffic and triggers operator strobe in milliseconds.' },
      { step: 7, title: 'Session Teardown & Secure Audit Archiving', state: 'SESSION_END', desc: 'Mission concludes. Radio bearer released cleanly and cryptographic session audit log is committed to archive.' }
    ];

    // Main App Component
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [systemState, setSystemState] = useState('IDLE');
      const [isTransmitting, setIsTransmitting] = useState(false);
      const [isMobilityRunning, setIsMobilityRunning] = useState(false);
      const [selectedNode, setSelectedNode] = useState(null);
      const [activeNodePulse, setActiveNodePulse] = useState(null);
      const [packets, setPackets] = useState([]);
      const [activeCamId, setActiveCamId] = useState('CAM-01');
      const [visionMode, setVisionMode] = useState('NORMAL');
      const [showCrosshairs, setShowCrosshairs] = useState(true);
      const [showMotionBox, setShowMotionBox] = useState(true);
      const [emergencyAlert, setEmergencyAlert] = useState(null);

      // Congestion & Telemetry State
      const [networkLoad, setNetworkLoad] = useState('LOW');
      const [signalDbm, setSignalDbm] = useState(-80);
      const [activeCameras, setActiveCameras] = useState(1);
      const [cameraBitrate, setCameraBitrate] = useState(256);
      const [admissionStatus, setAdmissionStatus] = useState('NORMAL');
      const [telemetry, setTelemetry] = useState({
        bitrateKbps: 256,
        latencyMs: 142,
        packetLossPct: 0.1,
        packetsSent: 0,
        packetsReceived: 0,
        packetsDropped: 0,
        queueHigh: 0,
        queueLow: 0,
        emergencyCount: 0
      });

      // Mobility State
      const [handoverState, setHandoverState] = useState({
        activeCell: 'Cell A',
        targetCell: null,
        status: 'IDLE',
        cellASignal: -8.2,
        cellBSignal: -17.5,
        cellCSignal: -22.0,
        distanceKm: 0.8,
        handoversCount: 0
      });

      // Scenario State
      const [scenarioIndex, setScenarioIndex] = useState(0);
      const [isScenarioRunning, setIsScenarioRunning] = useState(false);
      const [scenarioProgress, setScenarioProgress] = useState(0);
      const [scenarioSpeed, setScenarioSpeed] = useState(1);

      // Event Logs & Audit Logs
      const [eventLogs, setEventLogs] = useState([
        { id: 1, time: '21:00:00', source: 'SYSTEM', msg: 'System initialized. 3G UMTS network architecture standing by.', type: 'INFO' },
        { id: 2, time: '21:00:01', source: 'NODE-B', msg: 'WCDMA Carrier 2100 MHz active. 3.84 Mcps chip clock synchronized.', type: 'INFO' },
        { id: 3, time: '21:00:02', source: 'RNC', msg: 'Radio Network Controller ready. Radio Bearer pool initialized.', type: 'INFO' }
      ]);

      const [auditLogs, setAuditLogs] = useState([
        { id: 1, time: '21:00:01', device: 'CAMERA-01', user: 'Operator-01', action: 'System Ready Check', status: 'SUCCESS', details: 'USIM hardware authenticated.' }
      ]);

      const nodeSeq = ['camera-unit', 'node-b', 'rnc', 'packet-core', 'private-ip', 'app-server', 'monitoring-terminal'];

      const addLog = (source, msg, type = 'INFO') => {
        const time = new Date().toTimeString().split(' ')[0];
        setEventLogs(prev => [{ id: Date.now() + Math.random(), time, source, msg, type }, ...prev.slice(0, 79)]);
      };

      const addAudit = (device, user, action, status, details) => {
        const time = new Date().toTimeString().split(' ')[0];
        setAuditLogs(prev => [{ id: Date.now(), time, device, user, action, status, details }, ...prev.slice(0, 39)]);
      };

      // Admission Control Check
      useEffect(() => {
        if (activeCameras * cameraBitrate > 3840) {
          setAdmissionStatus('REJECTED');
          addLog('RNC-ADMISSION', `Admission Control: Rejected session for Camera #${activeCameras}. Insufficient capacity.`, 'WARNING');
        } else {
          setAdmissionStatus('NORMAL');
        }
      }, [activeCameras, cameraBitrate]);

      // Manual Packet Sender
      const sendPacket = (type, isAlarm = false) => {
        const colors = { VIDEO: '#06b6d4', AUDIO: '#a855f7', CONTROL: '#f59e0b', ALARM: '#ef4444', BACKGROUND: '#64748b' };
        const pkt = {
          id: Date.now() + Math.random(),
          type,
          priority: isAlarm || type === 'ALARM' ? 'CRITICAL' : type === 'BACKGROUND' ? 'LOW' : 'HIGH',
          currentLink: 0,
          progress: 0,
          color: colors[type] || '#06b6d4',
          label: type,
          isAlarm
        };
        setPackets(prev => [...prev, pkt]);
        setTelemetry(t => ({
          ...t,
          packetsSent: t.packetsSent + 1,
          queueHigh: pkt.priority !== 'LOW' ? (t.queueHigh + 1) % 15 : t.queueHigh,
          queueLow: pkt.priority === 'LOW' ? (t.queueLow + 1) % 12 : t.queueLow
        }));
        addLog('CAMERA-01', `Manual ${type} packet injected into radio buffer.`, isAlarm ? 'EMERGENCY' : 'INFO');
      };

      // Transmission Packet Interval
      useEffect(() => {
        if (!isTransmitting) return;
        const interval = setInterval(() => {
          const r = Math.random();
          let type = 'VIDEO';
          if (r > 0.85) type = 'AUDIO';
          else if (r > 0.75) type = 'CONTROL';
          else if (r > 0.65) type = 'BACKGROUND';

          if (networkLoad === 'CONGESTED' && type === 'BACKGROUND' && Math.random() > 0.3) {
            setTelemetry(t => ({ ...t, packetsDropped: t.packetsDropped + 1 }));
            return;
          }
          sendPacket(type, false);
        }, networkLoad === 'CONGESTED' ? 750 : 500);

        return () => clearInterval(interval);
      }, [isTransmitting, networkLoad]);

      // Packet Physics RAF
      useEffect(() => {
        if (packets.length === 0) return;
        const anim = requestAnimationFrame(() => {
          setPackets(prev => {
            const next = [];
            for (const pkt of prev) {
              let spd = 0.04;
              if (pkt.isAlarm) spd = 0.07;
              if (pkt.priority === 'LOW' && networkLoad === 'CONGESTED') spd = 0.015;
              const prog = pkt.progress + spd;
              if (prog >= 1) {
                const nextLink = pkt.currentLink + 1;
                const hitNode = nodeSeq[nextLink];
                setActiveNodePulse(hitNode);
                setTimeout(() => setActiveNodePulse(null), 250);
                if (nextLink >= 6) {
                  setTelemetry(t => ({ ...t, packetsReceived: t.packetsReceived + 1 }));
                } else {
                  next.push({ ...pkt, currentLink: nextLink, progress: 0 });
                }
              } else {
                next.push({ ...pkt, progress: prog });
              }
            }
            return next;
          });
        });
        return () => cancelAnimationFrame(anim);
      }, [packets, networkLoad]);

      // Mobility & Handover Loop
      useEffect(() => {
        if (!isMobilityRunning) return;
        const interval = setInterval(() => {
          setHandoverState(prev => {
            let dist = prev.distanceKm + 0.15;
            if (dist > 9.0) dist = 0.5;
            const aSig = Math.max(-25, -6.5 - Math.pow(dist - 1.5, 2) * 1.5);
            const bSig = Math.max(-25, -6.5 - Math.pow(dist - 4.5, 2) * 1.5);
            const cSig = Math.max(-25, -6.5 - Math.pow(dist - 7.5, 2) * 1.5);

            let st = prev.status;
            let active = prev.activeCell;
            let target = prev.targetCell;
            let count = prev.handoversCount;

            if (active === 'Cell A' && dist >= 2.8 && dist <= 3.4) {
              if (dist >= 3.0 && st !== 'HANDOVER_INITIATED') {
                st = 'HANDOVER_INITIATED';
                target = 'Cell B';
                addLog('RNC-HANDOVER', 'HANDOVER INITIATED: Cell A -> Cell B Active Set Update (Soft Handover)', 'WARNING');
                setSystemState('HANDOVER');
              }
            } else if (active === 'Cell A' && dist > 3.4) {
              st = 'HANDOVER_SUCCESSFUL';
              active = 'Cell B';
              target = null;
              count += 1;
              addLog('RNC-HANDOVER', 'HANDOVER SUCCESSFUL: Transferred seamlessly to Cell B. 0 frame freeze.', 'SUCCESS');
              setSystemState(isTransmitting ? 'STREAMING' : 'MOVING');
            }
            return { ...prev, distanceKm: parseFloat(dist.toFixed(2)), cellASignal: parseFloat(aSig.toFixed(1)), cellBSignal: parseFloat(bSig.toFixed(1)), cellCSignal: parseFloat(cSig.toFixed(1)), activeCell: active, targetCell: target, status: st, handoversCount: count };
          });
        }, 600);
        return () => clearInterval(interval);
      }, [isMobilityRunning, isTransmitting]);

      // Surveillance Video Canvas Rendering
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        let anim;
        let tx = 180, ty = 120, vx = 0.8, vy = 0.4;

        const render = () => {
          const w = canvas.width, h = canvas.height;
          ctx.fillStyle = visionMode === 'IR_THERMAL' ? '#180728' : '#060c18';
          ctx.fillRect(0, 0, w, h);

          if (!isTransmitting && systemState !== 'STREAMING' && systemState !== 'MOVING' && systemState !== 'EMERGENCY') {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 15px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('CAMERA STANDBY / TRANSMISSION PAUSED', w / 2, h / 2 - 10);
            ctx.font = '12px "Inter", sans-serif';
            ctx.fillStyle = '#64748b';
            ctx.fillText('Click "START LIVE TRANSMISSION" above to establish 3G video uplink', w / 2, h / 2 + 15);
            return;
          }

          // Horizon & Buildings
          ctx.strokeStyle = visionMode === 'IR_THERMAL' ? '#581c87' : '#1e293b';
          ctx.beginPath(); ctx.moveTo(0, h * 0.65); ctx.lineTo(w, h * 0.65); ctx.stroke();
          ctx.fillStyle = visionMode === 'IR_THERMAL' ? '#3b0764' : '#0a1526';
          ctx.fillRect(50, h * 0.35, 90, h * 0.3); ctx.fillRect(170, h * 0.28, 120, h * 0.37); ctx.fillRect(320, h * 0.4, 110, h * 0.25);

          // Moving Vehicle
          tx += vx; ty += vy;
          if (tx > w - 100 || tx < 80) vx *= -1;
          if (ty > h * 0.75 || ty < h * 0.55) vy *= -1;
          ctx.fillStyle = visionMode === 'IR_THERMAL' ? '#ef4444' : '#334155';
          ctx.fillRect(tx, ty, 60, 24);
          ctx.fillStyle = visionMode === 'IR_THERMAL' ? '#fbbf24' : '#1e293b';
          ctx.fillRect(tx + 12, ty - 12, 34, 12);

          // Motion Box
          if (showMotionBox) {
            ctx.strokeStyle = systemState === 'EMERGENCY' ? '#ef4444' : '#22c55e';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(tx - 8, ty - 18, 76, 50);
            ctx.fillStyle = systemState === 'EMERGENCY' ? '#ef4444' : '#22c55e';
            ctx.font = '10px "JetBrains Mono", monospace';
            ctx.textAlign = 'left';
            ctx.fillText(systemState === 'EMERGENCY' ? '⚠ ALERT: TARGET 01' : 'TRACKING: PATROL-V3', tx - 8, ty - 22);
          }

          // Crosshairs
          if (showCrosshairs) {
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.45)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(w / 2 - 20, h / 2); ctx.lineTo(w / 2 + 20, h / 2);
            ctx.moveTo(w / 2, h / 2 - 20); ctx.lineTo(w / 2, h / 2 + 20);
            ctx.stroke();
          }

          // Noise on Congestion or Poor Signal
          if (networkLoad === 'CONGESTED' || signalDbm < -95) {
            for (let i = 0; i < 15; i++) {
              ctx.fillStyle = Math.random() > 0.5 ? 'rgba(6, 182, 212, 0.3)' : 'rgba(239, 68, 68, 0.3)';
              ctx.fillRect(Math.random() * w, Math.random() * h, 40, 8);
            }
          }

          anim = requestAnimationFrame(render);
        };
        anim = requestAnimationFrame(render);
        return () => cancelAnimationFrame(anim);
      }, [isTransmitting, systemState, visionMode, showCrosshairs, showMotionBox, networkLoad, signalDbm]);

                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-cyan-400 font-bold block mb-1">3GPP TS 23.060</span>
                    <span className="text-slate-300 block">General Packet Radio Service (GPRS); Service description; Stage 2</span>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-cyan-400 font-bold block mb-1">3GPP TS 25.401</span>
                    <span className="text-slate-300 block">UTRAN Overall Description (Node B & RNC architecture)</span>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-cyan-400 font-bold block mb-1">3GPP TS 23.107</span>
                    <span className="text-slate-300 block">QoS Concept and Architecture (Conversational, Streaming, Interactive, Background)</span>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-900 border border-slate-800">
                    <span className="text-cyan-400 font-bold block mb-1">ITU-R Recommendation M.1457</span>
                    <span className="text-slate-300 block">Detailed specifications of the radio interfaces of IMT-2000</span>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Node Inspector Modal */}
          {selectedNode && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="max-w-xl w-full rounded-2xl border border-cyan-500/40 bg-slate-900 p-6 shadow-2xl relative">
                <button onClick={() => setSelectedNode(null)} className="absolute top-4 right-4 p-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white cursor-pointer">
                  <Icon name="close" className="w-5 h-5" />
                </button>
                <span className="text-[10px] font-mono text-cyan-400 font-bold uppercase">{selectedNode.category}</span>
                <h3 className="text-xl font-bold text-white font-['Outfit'] mt-1 mb-0.5">{selectedNode.name}</h3>
                <p className="text-xs text-slate-400 font-mono mb-4">{selectedNode.subtitle}</p>
                <div className="space-y-3 text-xs">
                  <div className="p-3 rounded-lg bg-slate-950 border border-slate-800"><strong className="text-cyan-300 block mb-1">Purpose:</strong><span className="text-slate-300">{selectedNode.purpose}</span></div>
                  <div className="p-3 rounded-lg bg-slate-950 border border-slate-800"><strong className="text-cyan-300 block mb-1">Role in Real-Time:</strong><span className="text-slate-300">{selectedNode.roleInRealTime}</span></div>
                  {selectedNode.subComponents && (
                    <div className="p-3 rounded-lg bg-slate-950 border border-slate-800"><strong className="text-cyan-300 block mb-1">Hardware Subcomponents:</strong>
                      <div className="flex flex-wrap gap-1 mt-1">
                        {selectedNode.subComponents.map((s, i) => (
                          <span key={i} className="px-2 py-0.5 rounded bg-slate-800 text-cyan-300 font-mono text-[10px]">{s}</span>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950/80 py-5 px-4 lg:px-8 mt-12 text-xs font-mono text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <span className="text-slate-400 font-semibold">Design of a 3G Communication System for Real-Time Applications</span>
              <div className="flex items-center gap-3 text-[11px] text-slate-400">
                <span>UMTS WCDMA FDD (3.84 Mcps)</span>
                <span>•</span>
                <span>3GPP Release 99/4/5</span>
                <span>•</span>
                <span className="text-cyan-400 font-bold">Academic Simulation Model</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
